<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" id="metaTheme" content="#0e1013">
<title>GymSense · 器械感知健身教练</title>
<style>
:root{
  --bg:#0e1013; --bg2:#16191f; --card:#1c2027; --card2:#232833;
  --line:#2b313c; --txt:#eef1f5; --sub:#9aa3b2; --dim:#6b7482;
  --acc:#4ade80; --acc2:#22c55e; --accD:#123c22;
  --blue:#60a5fa; --orange:#fbbf24; --red:#f87171; --purple:#c084fc;
  --r:14px; --tabH:62px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,"Helvetica Neue",sans-serif;font-size:15px;line-height:1.5;overscroll-behavior-y:none}
#app{max-width:520px;margin:0 auto;min-height:100%;position:relative}
.view{display:none;padding:calc(16px + env(safe-area-inset-top)) 16px calc(var(--tabH) + 28px + env(safe-area-inset-bottom));min-height:100vh}
.view.active{display:block}
h1{font-size:22px;font-weight:800;letter-spacing:.3px}
h2{font-size:17px;font-weight:700;margin:18px 0 10px}
.sub{color:var(--sub);font-size:13px}
.dim{color:var(--dim);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card2{background:var(--card2)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mb8{margin-bottom:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;background:var(--acc);color:#08240f;width:100%;transition:opacity .15s}
.btn:active{opacity:.75}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc2);}
.btn.warn{background:#3a1d1d;color:var(--red);border:1px solid #5b2b2b}
.btn.sm{padding:8px 12px;font-size:13px;width:auto;border-radius:10px}
.btn:disabled{opacity:.4}
.chip{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--sub);cursor:pointer;user-select:none}
.chip.on{background:var(--accD);border-color:var(--acc2);color:var(--acc);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
input,select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px 12px;font-size:15px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc2)}
label.fl{display:block;font-size:13px;color:var(--sub);margin:12px 0 6px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
/* tab bar */
#tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(14,16,19,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;max-width:520px;margin:0 auto;height:calc(var(--tabH) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:11px;cursor:pointer;font-weight:600}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--acc)}
/* header */
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{font-size:20px;font-weight:800}.logo em{color:var(--acc);font-style:normal}
/* plan day card */
.daycard{border-left:3px solid var(--acc2)}
.exrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:none}
.exnum{width:26px;height:26px;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--sub);font-weight:700;flex-shrink:0}
.exname{font-weight:600;font-size:14px}
.exmeta{font-size:12px;color:var(--sub)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--card2);color:var(--sub);margin-right:5px}
.tag.acc{background:var(--accD);color:var(--acc)}
.tag.blue{background:#14263f;color:var(--blue)}
.tag.orange{background:#3a2c0e;color:var(--orange)}
/* workout set rows */
.setrow{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:8px}
.setrow input{text-align:center;padding:9px 6px;font-size:16px;font-weight:600}
.setrow .done{width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--dim);font-size:18px;cursor:pointer;font-weight:800}
.setrow .done.on{background:var(--accD);border-color:var(--acc2);color:var(--acc)}
.sethead{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:8px;font-size:11px;color:var(--dim);margin-bottom:6px;text-align:center;font-weight:700}
/* timer bar */
#restbar{position:fixed;bottom:calc(var(--tabH) + env(safe-area-inset-bottom));left:0;right:0;max-width:520px;margin:0 auto;background:var(--accD);border-top:1px solid var(--acc2);padding:10px 16px;display:none;align-items:center;gap:12px;z-index:49}
#restbar.on{display:flex}
#restTime{font-size:24px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums;min-width:70px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet h3{font-size:17px;font-weight:800;margin-bottom:12px}
.handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
/* muscle svg */
.bodywrap{display:flex;justify-content:center;gap:18px;padding:8px 0}
.bodywrap svg{height:190px}
.mus{fill:#2b313c;stroke:#20242c;stroke-width:.8;transition:fill .2s}
.mus.hi{fill:var(--acc)}
.mus.hi2{fill:#2e7d4f}
.bodyoutline{fill:none;stroke:#3a4250;stroke-width:1.4}
/* progress bars */
.bar{height:10px;border-radius:5px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc2);border-radius:5px}
/* chat */
.msg{max-width:86%;padding:10px 13px;border-radius:14px;margin-bottom:8px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.msg.u{background:var(--accD);color:var(--txt);margin-left:auto;border-bottom-right-radius:4px}
.msg.a{background:var(--card2);border-bottom-left-radius:4px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--acc2);color:var(--txt);padding:10px 18px;border-radius:12px;z-index:200;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.4);display:none;max-width:90%}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg div{flex:1;text-align:center;padding:8px 4px;border-radius:8px;font-size:13px;color:var(--sub);cursor:pointer;font-weight:600}
.seg div.on{background:var(--card2);color:var(--acc)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:800;color:var(--acc)}
.stat span{font-size:11px;color:var(--sub)}
.listitem{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.listitem:last-child{border-bottom:none}
.arrow{color:var(--dim)}
.gauge{display:flex;gap:4px;margin-top:6px}
.gauge i{flex:1;height:6px;border-radius:3px;background:var(--card2)}
.gauge i.on{background:var(--acc2)}
canvas#shareCanvas{display:none}
/* accordion day cards */
.daycard .dayc-body{display:none}
.daycard.open .dayc-body{display:block}
.dayhead{cursor:pointer}
.daysum{font-size:12px;color:var(--sub);margin-top:2px}
.chev{color:var(--dim);font-size:12px;margin-left:6px;transition:transform .2s;display:inline-block}
.daycard.open .chev{transform:rotate(90deg)}
details.notice summary{cursor:pointer;font-weight:700;list-style:none}
details.notice summary::-webkit-details-marker{display:none}
/* ===== light theme ===== */
html[data-theme="light"]{
 --bg:#f2f4f7; --bg2:#ffffff; --card:#ffffff; --card2:#e9edf2;
 --line:#d8dfe7; --txt:#161f2a; --sub:#4e5d6d; --dim:#7a8695;
 --acc:#15803d; --acc2:#15803d; --accD:#d9f2e2;
 --blue:#2563eb; --orange:#a15c07; --red:#dc2626; --purple:#7c3aed;
}
html[data-theme="light"] #tabbar{background:rgba(250,251,253,.94)}
html[data-theme="light"] .btn{color:#ffffff}
html[data-theme="light"] .btn.sec{color:var(--txt)}
html[data-theme="light"] .btn.ghost{color:var(--acc)}
html[data-theme="light"] .notice{background:#e6eefb;border-color:#c9daf3;color:#2d5687}
html[data-theme="light"] .warnbox{background:#fbf1d8;border-color:#eddfb3;color:#8a5a08}
html[data-theme="light"] .tag.blue{background:#dde9fb;color:#2563eb}
html[data-theme="light"] .tag.orange{background:#faeccb;color:#a15c07}
html[data-theme="light"] .animwrap{background:#fafbfd;border-color:var(--line)}
html[data-theme="light"] .msg.u{background:#d9f2e2;color:#123723}
html[data-theme="light"] .bodyoutline{stroke:#b6c0cc}
html[data-theme="light"] .mus{fill:#d3dae2;stroke:#c2cbd5}
html[data-theme="light"] .mus.hi2{fill:#7cc79b}
html[data-theme="light"] .setrow2 .done{color:#9aa5b1}
html[data-theme="light"] .setrow2 .done.on{color:var(--acc)}
.notice{background:#14263f;border:1px solid #1e3a5f;border-radius:12px;padding:10px 12px;font-size:12.5px;color:#9ec5f2;margin-bottom:12px}
.warnbox{background:#3a2c0e;border:1px solid #5b4516;border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--orange)}
.svgchart{width:100%;height:170px;background:var(--bg2);border-radius:12px;border:1px solid var(--line)}
/* animation stage */
.animwrap{background:linear-gradient(180deg,#171b22,#12151b);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px}
.animwrap svg{width:100%;height:215px;display:block}
.animcap{text-align:center;font-size:11.5px;color:var(--dim);padding:0 0 8px}
/* stepper inputs */
.setrow2{display:grid;grid-template-columns:24px 1fr 1fr 52px;gap:8px;align-items:center;margin-bottom:9px}
.sethead2{display:grid;grid-template-columns:24px 1fr 1fr 52px;gap:8px;font-size:11px;color:var(--dim);margin-bottom:6px;text-align:center;font-weight:700}
.stepcell{display:flex;align-items:stretch;background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepcell input{border:none;border-radius:0;background:transparent;text-align:center;padding:9px 2px;font-size:16px;font-weight:700;min-width:0;flex:1}
.stepbtn{width:36px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;color:var(--acc);background:var(--card2);border:none;cursor:pointer;user-select:none;touch-action:manipulation}
.stepbtn:active{background:var(--accD)}
.setrow2 .done{width:52px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--dim);font-size:20px;cursor:pointer;font-weight:800}
.setrow2 .done.on{background:var(--accD);border-color:var(--acc2);color:var(--acc)}
.swapmini{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--sub);font-size:14px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="app">

  <!-- ===== 计划 Plan ===== -->
  <div class="view" id="view-plan">
    <div class="hd"><div class="logo">Gym<em>Sense</em></div><button class="btn sm sec" id="btnLang">EN</button></div>
    <div id="planBody"></div>
  </div>

  <!-- ===== 训练 Workout ===== -->
  <div class="view" id="view-workout"><div id="workoutBody"></div></div>

  <!-- ===== 器械 Gym ===== -->
  <div class="view" id="view-gym"><div id="gymBody"></div></div>

  <!-- ===== 进度 Progress ===== -->
  <div class="view" id="view-progress"><div id="progressBody"></div></div>

  <!-- ===== 我的 Me ===== -->
  <div class="view" id="view-me"><div id="meBody"></div></div>

  <!-- ===== Onboarding ===== -->
  <div class="view" id="view-onboard"><div id="onboardBody"></div></div>

  <!-- rest timer bar -->
  <div id="restbar">
    <div id="restTime">90</div>
    <div class="grow sub" id="restLabel"></div>
    <button class="btn sm sec" id="restMinus">-15s</button>
    <button class="btn sm sec" id="restPlus">+15s</button>
    <button class="btn sm" id="restSkip">✕</button>
  </div>

  <!-- tab bar -->
  <div id="tabbar">
    <div class="tab" data-v="plan"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/></svg><span data-t="tabPlan"></span></div>
    <div class="tab" data-v="workout"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg><span data-t="tabWork"></span></div>
    <div class="tab" data-v="gym"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/></svg><span data-t="tabGym"></span></div>
    <div class="tab" data-v="progress"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg><span data-t="tabProg"></span></div>
    <div class="tab" data-v="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6.5 8-6.5s8 2.5 8 6.5"/></svg><span data-t="tabMe"></span></div>
  </div>

  <!-- generic modal -->
  <div class="modal" id="modal"><div class="sheet" id="sheet"><div class="handle"></div><div id="sheetBody"></div></div></div>
  <div class="toast" id="toast"></div>
  <canvas id="shareCanvas" width="750" height="1000"></canvas>
</div>
<script>

/* IndexedDB blob cache (in-memory fallback) */
let _idb=null;const _memMedia=new Map();
function idbOpen(){return new Promise((ok,bad)=>{
  if(!window.indexedDB)return ok(null);
  if(_idb)return ok(_idb);
  try{const r=indexedDB.open("gymsense-media",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("media");
    r.onsuccess=()=>{_idb=r.result;ok(_idb)};
    r.onerror=()=>ok(null);
  }catch(e){ok(null)}
})}
async function mediaGet(k){const db=await idbOpen();if(!db)return _memMedia.get(k)||null;
  return new Promise(ok=>{try{const t=db.transaction("media").objectStore("media").get(k);t.onsuccess=()=>ok(t.result||null);t.onerror=()=>ok(null)}catch(e){ok(null)}})}
async function mediaSet(k,v){const db=await idbOpen();if(!db){_memMedia.set(k,v);return}
  return new Promise(ok=>{try{const t=db.transaction("media","readwrite").objectStore("media").put(v,k);t.onsuccess=()=>ok();t.onerror=()=>ok()}catch(e){ok()}})}
async function mediaKeys(){const db=await idbOpen();if(!db)return[..._memMedia.keys()];
  return new Promise(ok=>{try{const t=db.transaction("media").objectStore("media").getAllKeys();t.onsuccess=()=>ok(t.result||[]);t.onerror=()=>ok([])}catch(e){ok([])}})}
async function mediaClearAll(){_memMedia.clear();const db=await idbOpen();if(!db)return;

/* custom gender-aware animation pack: base/{sex}/{exId}.mp4|gif -> base/{exId}.* -> other sex */
async function mediaFetchAnim(exId){
  const base=(S.settings.animBase||"").replace(/\/+$/,"");if(!base)return null;
  const sex=(S.profile&&S.profile.sex)||"male";
  const other=sex==="male"?"female":"male";
  const cands=[
    {p:sex+"/"+exId,sexed:true},{p:exId,sexed:false},{p:other+"/"+exId,sexed:true,fallbackSex:other},
  ];
  for(const c of cands){
    for(const ext of ["mp4","gif"]){
      try{
        const r=await fetch(base+"/"+c.p+"."+ext);
        if(!r.ok)continue;
        const blob=await r.blob();
        if(blob.size<100)continue;
        return {blob,type:ext,sexed:c.sexed,sex:c.fallbackSex||sex,ts:Date.now()};
      }catch(e){}
    }
  }
  return null;
}
function animNeedsUpdate(rec){
  if(!(S.settings.animBase||""))return false;
  if(!rec.anim)return true;
  const sex=(S.profile&&S.profile.sex)||"male";
  return rec.anim.sexed&&rec.anim.sex!==sex;
}
/* download one exercise's media (json meta + 2 photos + optional anim) with mirror fallback */
async function mediaFetchOne(exId){
  const edb=EDB_MAP[exId];if(!edb)return false;
  let rec=await mediaGet(exId);
  if(!rec){
    for(const base of MEDIA_BASES){
      try{
        const mr=await fetch(base+"/exercises/"+edb+".json");
        if(!mr.ok)continue;
        const meta=await mr.json();
        const imgs=[];
        for(const rel of (meta.images||[]).slice(0,2)){
          const ir=await fetch(base+"/exercises/"+rel);
          if(!ir.ok)throw 0;
          imgs.push(await ir.blob());
        }
        if(!imgs.length)continue;
        rec={edbId:edb,name:meta.name||edb,instructions:meta.instructions||[],imgs,ts:Date.now()};
        break;
      }catch(e){}
    }
  }
  if(!rec)return false;
  if(animNeedsUpdate(rec)){
    const anim=await mediaFetchAnim(exId);
    if(anim)rec.anim=anim;
  }
  await mediaSet(exId,rec);
  /* v1.9.3: instructions in the app language — auto-translate via user's own API; failure = silent EN fallback */
  if(LANG==="zh")await mediaTranslateOne(exId).catch(()=>{});
  return true;
}
async function mediaTranslateOne(exId){
  if(!S.settings.apiKey)return false;
  const rec=await mediaGet(exId);
  if(!rec||!rec.instructions||!rec.instructions.length||rec.instrZh)return false;
  try{
    const txt=await callAI([{role:"user",content:"Translate these gym exercise instructions into natural, concise simplified Chinese for a fitness app (keep numbers/units, no extra commentary). Return ONLY a JSON array of strings, one per step, same order and count:\n"+JSON.stringify(rec.instructions)}],1200);
    const m=String(txt).match(/\[[\s\S]*\]/);if(!m)return false;
    const arr=JSON.parse(m[0]);
    if(!Array.isArray(arr)||!arr.length||!arr.every(s=>typeof s==="string"))return false;
    rec.instrZh=arr;await mediaSet(exId,rec);
    return true;
  }catch(e){return false}
}

function migrate(o,raw){
  const v=o.schemaVersion||1;
  if(v<SCHEMA){
    /* snapshot old data once before migrating (rollback safety) */
    try{if(!store.get("gymsense-backup-v"+v))store.set("gymsense-backup-v"+v,raw)}catch(e){}
    if(!o.flags)o.flags={};
    (o.gyms||[]).forEach(g=>{if(!g.barKg)g.barKg=20;if(!g.plates)g.plates=DEF_PLATES.slice()});
    (o.logs||[]).forEach(l=>{if(l.dayIdx===undefined)l.dayIdx=null});
    if(o.profile)o.flags.welcomed=true; /* existing users skip welcome */
    o.schemaVersion=SCHEMA;
  }
  return o;
}

/* ===== user state machine (P0: S0-S4) ===== */
function daysSinceLastLog(){
  if(!S.logs.length)return null;
  return Math.floor((Date.now()-new Date(S.logs[S.logs.length-1].date).getTime())/86400000);
}
function userState(){
  if(!S.profile)return "S0";
  const n=S.logs.length;
  if(n===0)return "S1";
  if(n<4)return "S2";
  return daysSinceLastLog()>=14?"S4":"S3";
}
function comebackFactor(){
  if(userState()!=="S4")return 1;
  return daysSinceLastLog()>=28?0.8:0.9;
}
/* ===== P0-1 today recommendation ===== */
function recDayIdx(){
  const days=S.plan?S.plan.days:[];if(!days.length)return 0;
  for(let i=S.logs.length-1;i>=0;i--){
    const l=S.logs[i];
    let idx=(l.dayIdx!==undefined&&l.dayIdx!==null&&l.dayIdx>=0)?l.dayIdx:days.findIndex(d=>d.key===l.dayKey);
    if(idx>=0&&idx<days.length)return (idx+1)%days.length;
  }

function progressionTarget(exId,repsStr,freeze){
  const m=String(repsStr||"").match(/(\d+)\s*-\s*(\d+)/);
  const lo=m?+m[1]:(+repsStr||8), hi=m?+m[2]:(+repsStr||12);
  const bw=isBW(exId), tm=isTime(exId);
  const sessions=exSessions(exId);
  if(sessions<2)return {baseline:true,lo,hi,bwMode:bw,tm};
  const last=nthLastSetsFor(exId,0);
  if(!last||!last.length)return {baseline:true,lo,hi,bwMode:bw,tm};
  const w=Math.max(...last.map(s=>+s.w||0));
  if(w<=0&&!bw)return {baseline:true,lo,hi};
  const bestReps=Math.max(...last.map(s=>+s.r||0));
  /* time-based (e.g. plank): progress by +10s, cap 120s */
  if(tm){
    const base=Math.max(lo,bestReps);
    if(freeze||sessions===2)return {w:0,reps:base,lo,hi,tm:true,bwMode:true,frozen:freeze};
    return {w:0,reps:Math.min(120,base+10),lo,hi,tm:true,bwMode:true};
  }
  const asstMode=isAsst(exId)&&w<0;
  if(freeze)return {w,reps:Math.max(lo,Math.min(hi,bestReps)),lo,hi,frozen:true,bwMode:bw&&w===0,asstMode};
  if(sessions===2)return {w,reps:Math.max(lo,Math.min(hi,bestReps)),lo,hi,bwMode:bw&&w===0,asstMode};
  const allHi=last.every(s=>(+s.r||0)>=hi);
  const anyBelowLo=last.some(s=>(+s.r||0)<lo);
  /* assisted (negative weight = assistance): progress reps, then reduce assistance toward 0 */
  if(asstMode){
    if(allHi)return {w:Math.min(0,Math.round((w+2.5)*10)/10),reps:lo,lo,hi,asstMode:true,asstDown:true};
    if(anyBelowLo)return {w,reps:Math.max(lo,Math.min(hi,bestReps)),lo,hi,hold:true,asstMode:true};
    return {w,reps:Math.min(hi,bestReps+1),lo,hi,asstMode:true};
  }
  /* pure bodyweight: reps first; when the whole range is topped, suggest adding load */
  if(bw&&w<=0){
    if(allHi)return {w:2.5,reps:lo,lo,hi,addLoad:true};
    if(anyBelowLo)return {w:0,reps:Math.max(lo,Math.min(hi,bestReps)),lo,hi,hold:true,bwMode:true};
    return {w:0,reps:Math.min(hi,bestReps+1),lo,hi,bwMode:true};
  }
  if(allHi){
    const inc=(bw||!LOWER_COMPOUND.includes(exId))?2.5:5;
    return {w:Math.round((w+inc)*10)/10,reps:lo,lo,hi,inc:true};
  }
  if(anyBelowLo){
    const prev=nthLastSetsFor(exId,1);
    const prevBelow=prev&&prev.some(s=>(+s.r||0)<lo);
    return {w,reps:Math.max(lo,Math.min(hi,bestReps)),lo,hi,hold:true,deload:!!prevBelow};
  }

}

function plateBreakdown(total,barKg,plates){
  const sorted=plates.slice().sort((a,b)=>b-a);
  const minP=Math.min(...sorted);
  let per=(total-barKg)/2;
  if(per<-1e-9)return {bad:true,lower:barKg,upper:barKg};
  const out=[];let rem=per;
  for(const p of sorted){while(rem>=p-1e-9){out.push(p);rem-=p}}
  if(rem>1e-6){
    const lower=barKg+2*(per-rem);
    return {bad:true,lower:Math.round(lower*100)/100,upper:Math.round((lower+2*minP)*100)/100};
  }
  return {plates:out,per:Math.round(per*100)/100};
}

function renderAnim(exId,t){
 const cfg=EXANIM[exId];if(!cfg)return null;
 const pat=ANIMS[cfg.p];if(!pat)return null;
 const A=pat.frames[0],B=pat.frames[1];
 const f=lerpPose(A,B,t);
 let s=pat.st?pat.st(f):"";
 if(cfg.extra)s+=cfg.extra(f);
 /* motion path arrow */
 if(pat.pm&&A[pat.pm]&&B[pat.pm]){
   const a=A[pat.pm],b=B[pat.pm];
   s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${CO}" stroke-width="1.6" stroke-dasharray="4 4" opacity=".55"/>`;
   const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);
   const ax=b[0],ay=b[1];
   s+=`<path d="M ${ax} ${ay} L ${ax-8*Math.cos(ang-0.4)} ${ay-8*Math.sin(ang-0.4)} L ${ax-8*Math.cos(ang+0.4)} ${ay-8*Math.sin(ang+0.4)} Z" fill="${CO}" opacity=".55"/>`;
 }
 s+=(pat.view==="front"?figFront(f):figSide(f));
 if(pat.dyn)s+=pat.dyn(f);
 const mk=cfg.eq!==undefined?cfg.eq:pat.eq;
 if(mk&&mk!=="none"&&MK[mk]&&pat.view!=="front"){
   let anchor=f.wr;
   if(cfg.p==="squat"||cfg.p==="calf")anchor=[f.sh[0],f.sh[1]-6];
   else if(cfg.p==="legext"||cfg.p==="legcurl")anchor=f.an;
   s+=MK[mk](anchor);
 }
 return s;
}
let animRAF=null;
function startAnim(exId){
 cancelAnimationFrame(animRAF);
 const t0=performance.now();
 const tick=now=>{
   const el=document.getElementById("exAnim");
   if(!el){animRAF=null;return}
   const cyc=2600; // ms per rep
   const ph=((now-t0)%cyc)/cyc;
   const t=(1-Math.cos(ph*2*Math.PI))/2; // 0->1->0 eased
   const s=renderAnim(exId,t);
   if(s!==null)el.innerHTML=s;
   animRAF=requestAnimationFrame(tick);
 };
 animRAF=requestAnimationFrame(tick);
}

function openSheet(html){$("#sheetBody").innerHTML=html;$("#modal").classList.add("on")}
function closeSheet(){$("#modal").classList.remove("on")}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeSheet()});
function switchView(v){
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));
  $("#view-"+v).classList.add("active");
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.v===v));
  if(v==="plan")renderPlan();if(v==="workout")renderWorkout();if(v==="gym")renderGym();
  if(v==="progress")renderProgress();if(v==="me")renderMe();
  window.scrollTo(0,0);
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>switchView(t.dataset.v));
function applyLangTabs(){document.querySelectorAll("[data-t]").forEach(el=>el.textContent=T(el.dataset.t))}
$("#btnLang").onclick=()=>{LANG=LANG==="zh"?"en":"zh";S.settings.lang=LANG;save();$("#btnLang").textContent=LANG==="zh"?"EN":"中";applyLangTabs();renderPlan()};

/* sequential media download with progress sheet */
async function dlMediaFlow(ids){
  openSheet(`<h3>${T("mediaTitle")}</h3><div id="dlStatus" class="sub"></div><div class="bar mt12"><i id="dlBar" style="width:0%"></i></div><p class="dim mt12">${T("mediaSrcNote")}</p>`);
  let okN=0,failN=0;
  for(let i=0;i<ids.length;i++){
    const st=document.getElementById("dlStatus");if(!st)return; // sheet closed -> abort
    st.textContent=fmt(T("dlProgress"),{i:i+1,n:ids.length,name:exName(ids[i])});
    (await mediaFetchOne(ids[i]))?okN++:failN++;
    const bar=document.getElementById("dlBar");if(bar)bar.style.width=Math.round((i+1)/ids.length*100)+"%";
  }
  closeSheet();
  toast(fmt(T("dlDone"),{ok:okN,fail:failN?fmt(T("dlFailPart"),{n:failN}):""}));
  const cur=document.querySelector(".tab.active");
  switchView(cur?cur.dataset.v:"plan");
}

/* v1.9.3: instruction block in app language (zh cached translation + collapsible EN original) */
function instrBlock(rec,exId){
  if(!rec.instructions||!rec.instructions.length)return "";
  const li=arr=>arr.map(s=>`<li class="sub" style="margin-bottom:6px">${esc(s)}</li>`).join("");
  if(LANG==="zh"&&rec.instrZh&&rec.instrZh.length){
    return `<details class="card" style="margin-bottom:10px" open><summary style="cursor:pointer;font-weight:700">${T("instrZhLabel")}</summary><ol style="padding-left:18px;margin-top:8px">${li(rec.instrZh)}</ol><details style="margin-top:6px"><summary class="dim" style="cursor:pointer;font-size:12px">${T("instrEnLabel")}</summary><ol style="padding-left:18px;margin-top:8px">${li(rec.instructions)}</ol></details></details>`;
  }
  const canTr=LANG==="zh"&&S.settings.apiKey;
  return `<details class="card" style="margin-bottom:10px"><summary style="cursor:pointer;font-weight:700">${T("steps")}</summary><ol style="padding-left:18px;margin-top:8px">${li(rec.instructions)}</ol>${canTr?`<button class="btn sm sec" id="btnTrIns" data-tr="${exId}">${T("translateBtn")}</button>`:""}</details>`;
}
/* v1.9.4.1: translate updates ONLY the instruction block in place — never re-render the media/images
   (re-reading blobs from IndexedDB right after a write can leave photos blank for ~1min on iOS) */
function hookInstr(exId){
  const trBtn=document.getElementById("btnTrIns");
  if(!trBtn)return;
  trBtn.onclick=async()=>{
    trBtn.innerHTML=`<span class="spin"></span> ${T("translating")}`;
    const okTr=await mediaTranslateOne(exId);
    if(!okTr){trBtn.textContent="✕ "+T("scanFail");return}
    const wrap=document.getElementById("instrWrap");
    if(wrap){const rec=await mediaGet(exId);wrap.innerHTML=instrBlock(rec,exId);hookInstr(exId)}
  };
}

async function loadEdbMedia(exId){
  const slot=document.getElementById("edbMedia");if(!slot)return;

/* ================= WORKOUT ================= */
function startWorkout(dayIdx){
  const d=S.plan.days[dayIdx];
  if(d.swimSegs){
    W={dayIdx,dayKey:"swim",start:Date.now(),swim:true,
       segs:d.swimSegs.map(s=>({k:s.k,d:s.d,tz:s.tz,te:s.te,done:false})),entries:[]};
    switchView("workout");return;
  }
  /* first-run 3-card guide (once, before very first strength workout) */
  if(!S.flags.firstGuide&&S.logs.length===0){
    S.flags.firstGuide=1;save();
    openSheet(`<h3>${T("fgTitle")}</h3><div class="card"><p class="sub">${T("fg1")}</p><p class="sub mt8">${T("fg2")}</p><p class="sub mt8">${T("fg3")}</p></div><button class="btn mt8" id="fgGo">${T("fgGo")}</button>`);
    $("#fgGo").onclick=()=>{closeSheet();startWorkout(dayIdx)};
    return;
  }
  /* P0-2: readiness check for stable users (auto-skips to silent mode after 3 skips) */
  if(userState()==="S3"&&(S.flags.rdSkips||0)<3){openReadiness(dayIdx);return}
  beginStrength(dayIdx,null);
}
/* v1.9.3: most recent strength session's post-workout check (only if within 7 days) */
function lastPost(){
  for(let i=S.logs.length-1;i>=0;i--){
    const l=S.logs[i];
    if(l.dayKey==="swim")continue;
    if((Date.now()-new Date(l.date).getTime())>7*86400000)return null;
    return l.post||null;
  }
  return null;
}
function beginStrength(dayIdx,readiness){
  const d=S.plan.days[dayIdx];
  const cf=comebackFactor();
  const lp=lastPost();
  const lpAches=(lp&&lp.aches)||[];
  const lpHard=!!(lp&&lp.feel===2);
  const freeze=(readiness&&readiness.score>=2)||cf<1||lpHard;
  W={dayIdx,dayKey:d.key,label:d.label||"",start:Date.now(),cf,freeze,readiness:readiness||null,entries:d.exercises.map(e=>{
    const tempCau=lpAches.length>0&&riskAreas(e.exId,lpAches).length>0;
    const tgt=progressionTarget(e.exId,e.reps,freeze||tempCau);
    const last=lastSetsFor(e.exId);
    const sets=[];
    for(let i=0;i<e.sets;i++){
      const ls=last&&last[Math.min(i,last.length-1)];
      let w=(tgt&&!tgt.baseline)?tgt.w:(ls?ls.w:"");
      if(w!==""&&cf<1)w=Math.round((+w*cf)*2)/2;
      if(isBW(e.exId)&&(w===""||+w===0))w=""; /* empty = pure bodyweight */
      sets.push({w,r:"",done:false});
    }
    return {exId:e.exId,reps:e.reps,rest:e.rest,sets,target:tgt,tempCau};
  })};
  /* soreness/feel from last session -> visible notes this session */
  const notes=[];
  if(lpAches.length)notes.push(fmt(T("tempCauNote"),{a:lpAches.map(x=>T("inj_"+x)).join("、")}));
  if(lpHard)notes.push(T("lastHardNote"));
  else if(lp&&lp.feel===0)notes.push(T("lastEasyNote"));
  W.postNotes=notes;
  if(readiness)applyReadiness(W.entries,readiness.score,0.9);
  switchView("workout");
}
/* P0-2 readiness sheet: 3 taps, big buttons */
function openReadiness(dayIdx){
  const a=[null,null,null];
  /* v1.9.3: prefill "slightly sore" if last post-check reported aches */
  const lp0=lastPost();
  if(lp0&&lp0.aches&&lp0.aches.length)a[1]=1;
  const QS=[["rd_sleep",["rd_g","rd_m","rd_b"]],["rd_sore",["rd_none","rd_slight","rd_heavy"]],["rd_feel",["rd_g","rd_m","rd_b"]]];
  function render(){
    let h=`<div class="row"><h3 class="grow">${T("rdTitle")}</h3><button class="btn sm sec" id="rdSkip">${T("rdSkip")}</button></div>`;
    QS.forEach((q,qi)=>{
      h+=`<label class="fl">${T(q[0])}</label><div class="seg" data-q="${qi}">${q[1].map((o,oi)=>`<div data-o="${oi}" class="${a[qi]===oi?"on":""}" style="padding:12px 4px">${T(o)}</div>`).join("")}</div>`;
    });
    /* stable layout: explanation slot + primary button always rendered (disabled until 3 answers) */
    const done=a.every(x=>x!==null);
    const score=done?(a[0]+a[1]+a[2]):0;
    const sore=done&&a[1]===2;
    const expl=done?(sore?T("rdExplSore"):(score>=4?T("rdExpl46"):(score>=2?T("rdExpl23"):T("rdExpl0")))):T("rdNeedAll");
    h+=`<div class="${done&&(score>=2||sore)?"warnbox":"notice"} mt12" style="min-height:42px">${expl}</div>`;
    if(sore)h+=`<button class="btn mt12" id="rdSwitch">${T("rdSwitch")}</button>`;
    h+=`<button class="btn ${sore?"sec":""} mt8" id="rdGo" ${done?"":"disabled"}>${T("rdApply")}</button>`;
    if(done&&score>=4)h+=`<button class="btn sec mt8" id="rdRest">${T("rdRest")}</button>`;
    openSheet(h);
    document.querySelectorAll("[data-q]").forEach(seg=>seg.onclick=e=>{
      const d=e.target.closest("[data-o]");if(!d)return;
      a[+seg.dataset.q]=+d.dataset.o;render();
    });
    $("#rdSkip").onclick=()=>{S.flags.rdSkips=(S.flags.rdSkips||0)+1;save();closeSheet();beginStrength(dayIdx,null)};
    const go=$("#rdGo");
    if(go)go.onclick=()=>{S.flags.rdSkips=0;save();closeSheet();beginStrength(dayIdx,{a:a.slice(),score:a[0]+a[1]+a[2]})};
    const sw=$("#rdSwitch");
    if(sw)sw.onclick=()=>{S.flags.rdSkips=0;save();closeSheet();
      const n=(dayIdx+1)%S.plan.days.length;
      S.plan.days[n].swimSegs?startWorkout(n):beginStrength(n,null)};
    const rest=$("#rdRest");
    if(rest)rest.onclick=closeSheet;
  }
  render();
}

    const seed=()=>{
      if(inp.value!=="")return parseFloat(inp.value);
      const prev=si>0?W.entries[ei].sets[si-1][fld]:"";
      if(prev!=="")return parseFloat(prev)||0;
      return fld==="r"?repTop(W.entries[ei].reps||"10"):0;

      const inc=fld==="w"?2.5:1;
      let v=seed()+dir*inc;
      const minV=(fld==="w"&&isAsst(W.entries[ei].exId))?-50:0;

function openSwap(ei,autoScan){
  const en=W.entries[ei];
  const subs=substitutesFor(en.exId);
  if(!subs.length){toast(T("noEq"));return}
  /* P0-5: scan the machine in front of you -> filtered swap list */

  <input type="file" id="swFile" accept="image/*" capture="environment" style="display:none">
  <div id="swNote"></div><div id="swList"></div>`);
  const pick=id=>{
    const last=lastSetsFor(id);
    en.exId=id;en.target=progressionTarget(id,en.reps,W.freeze);
    en.sets=en.sets.map((s,i)=>{
      const ls=last&&last[Math.min(i,last.length-1)];
      let w=(en.target&&!en.target.baseline)?en.target.w:(ls?ls.w:"");

    });

  };

    $("#swList").querySelectorAll("[data-pick]").forEach(x=>x.onclick=()=>pick(x.dataset.pick));
  };
  renderList(subs);
  $("#swScan").onclick=()=>{
    if(!S.settings.apiKey){toast(T("scanSwapNoKey"));return}
    $("#swFile").click();
  };
  $("#swFile").onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    const btn=$("#swScan");btn.innerHTML=`<span class="spin"></span> ${T("scanning")}`;
    const proceed=ids=>{
      /* self-reinforcing gym profile: offer to add newly seen equipment */
      const gym=S.gyms[S.activeGym];
      ids.forEach(id=>{
        if(gym&&!gym.eq.includes(id)&&confirm(fmt(T("scanAddEq"),{name:eqName(id)}))){gym.eq.push(id);save()}
      });
      const pool=substitutesFor(en.exId);

      $("#swNote").innerHTML=`<p class="sub mb8">✅ ${ids.map(eqName).join("、")} — ${T("scanFrom")}</p>`;
      renderList(filtered);
    };
    try{
      const cands=await aiScanEquipment([f]);
      btn.textContent=T("scanSwap");
      if(cands.length>1){
        /* v1.9.3: multiple candidates -> user confirms which machine is in front of them */

        $("#swCands").querySelectorAll("[data-cand]").forEach(x=>x.onclick=()=>proceed([x.dataset.cand]));
      }else proceed([cands[0].id]);
    }catch(err){btn.textContent=T("scanSwap");toast(T("scanNone"))}
  };
  /* quick-scan entry from the exercise card camera icon */
  if(autoScan){
    if(!S.settings.apiKey)toast(T("scanSwapNoKey"));
    else $("#swFile").click();
  }
}

function finishWorkout(){
  if(W.swim){
    const done=W.segs.filter(s=>s.done);
    if(!done.length){W=null;renderWorkout();return}
    if(!confirm(T("finishConfirm")))return;
    const dist=+($("#swimDist")&&$("#swimDist").value)||done.reduce((a,s)=>a+s.d,0);
    const mins=+($("#swimTime")&&$("#swimTime").value)||Math.max(1,Math.round((Date.now()-W.start)/60000));
    const log={date:new Date().toISOString(),dayKey:"swim",durMin:mins,swimDist:dist,segsDone:done.length,entries:[]};
    S.logs.push(log);save();W=null;
    openShareCard(log,0);renderWorkout();return;
  }
  const done=W.entries.filter(e=>e.sets.some(s=>s.done));
  if(!done.length){W=null;renderWorkout();return}
  if(!confirm(T("finishConfirm")))return;
  const prevBest={};done.forEach(e=>{prevBest[e.exId]=bestFor(e.exId).maxw});
  const log={date:new Date().toISOString(),dayKey:W.dayKey,dayLabel:W.label||"",dayIdx:(W.dayIdx!==undefined&&W.dayIdx>=0)?W.dayIdx:null,readiness:W.readiness?{a:W.readiness.a,score:W.readiness.score}:undefined,durMin:Math.max(1,Math.round((Date.now()-W.start)/60000)),
    entries:done.map(e=>({exId:e.exId,sets:e.sets.filter(s=>s.done).map(s=>({w:+s.w||0,r:+s.r||0,done:true}))}))};
  const prs=[];log.entries.forEach(e=>{const mx=Math.max(...e.sets.map(s=>s.w));if(mx>(prevBest[e.exId]||0)&&mx>0)prs.push({exId:e.exId,w:mx})});
  log.prs=prs;
  S.logs.push(log);save();stopRest();
  const vol=totalVolume(log);
  W=null;
  openPostCheck(log,vol);
  if(S.logs.length===1)setTimeout(()=>toast(T("unlockTeaser")),600);
  renderWorkout();
}

function lineChart(series){
  if(series.length<2)return `<div class="svgchart" style="display:flex;align-items:center;justify-content:center"><span class="dim">— ${series.length} pt —</span></div>`;
  const w=320,hh=170,pad=28;
  const vs=series.map(s=>s.v);const mn=Math.min(...vs),mx=Math.max(...vs);const rng=mx-mn||1;
  const pts=series.map((s,i)=>{const x=pad+i*(w-pad*1.5)/(series.length-1);const y=hh-pad-((s.v-mn)/rng)*(hh-pad*2);return[x,y]});
  return `<svg class="svgchart" viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none">
  <polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linejoin="round"/>
  ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.4" fill="#4ade80"/><text x="${p[0]}" y="${p[1]-9}" fill="#9aa3b2" font-size="10" text-anchor="middle">${series[i].v}</text>`).join("")}
  <text x="${pad}" y="${hh-6}" fill="#6b7482" font-size="10">${series[0].d}</text>
  <text x="${w-pad/2}" y="${hh-6}" fill="#6b7482" font-size="10" text-anchor="end">${series[series.length-1].d}</text></svg>`;
}

function openShareCard(log,vol){

  ctx.fillStyle="#9aa3b2";ctx.font="26px -apple-system,sans-serif";ctx.fillText(log.date.slice(0,10)+" · "+TD(log.dayKey),60,160);
  ctx.strokeStyle="#2b313c";ctx.beginPath();ctx.moveTo(60,200);ctx.lineTo(690,200);ctx.stroke();

    ctx.fillStyle="#eef1f5";ctx.font="bold 56px -apple-system,sans-serif";ctx.fillText(String(s[0]),x,y);
    ctx.fillStyle="#6b7482";ctx.font="24px -apple-system,sans-serif";ctx.fillText(String(s[1]),x,y+38)});

  if(isSwim){ctx.fillStyle="#60a5fa";ctx.font="bold 34px -apple-system,sans-serif";ctx.fillText("🏊 "+T("swimSession"),60,y);y+=52}
  log.entries.slice(0,6).forEach(e=>{
    const bs=e.sets.reduce((a,s)=>(+s.w>+a.w?s:(+s.w===+a.w&&+s.r>+a.r?s:a)),e.sets[0]);

    ctx.fillStyle="#4ade80";ctx.textAlign="right";ctx.fillText(fmtSet(bs,e.exId),690,y);ctx.textAlign="left";

  ctx.fillStyle="#6b7482";ctx.font="22px -apple-system,sans-serif";ctx.fillText(LANG==="zh"?"器械感知 · AI力量教练":"The AI coach that knows your gym",60,950);
  const url=cv.toDataURL("image/png");
  openSheet(`<h3>${T("share")}</h3><img src="${url}" style="width:100%;border-radius:14px"><p class="dim mt8 center">${T("shareMade")}</p><button class="btn sec mt12" onclick="closeSheet()">${T("done")}</button>`);
}

function wrapNetErr(e){
  const m=String((e&&e.message)||e);
  if(e&&e.name==="TypeError"||m.includes("Failed to fetch")||m.includes("Load failed")||m.includes("NetworkError"))return new Error(T("netErr"));
  return e;
}
async function callAI(messages,maxTokens){
  const st=S.settings;const key=st.apiKey;if(!key)throw new Error(T("aiScanNeedKey"));
  try{
    if(aiProvider()==="anthropic"){
      const res=await fetch(aiBase()+"/v1/messages",{
        method:"POST",
        headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:st.model||"claude-sonnet-4-5",max_tokens:maxTokens||800,system:AI_SYS(),messages})
      });
      if(!res.ok){const t=await res.text();throw new Error(res.status+" "+t.slice(0,200))}
      const data=await res.json();
      return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
    }
    /* OpenAI-compatible path (DeepSeek / custom) */
    const mdl=st.model||(aiProvider()==="deepseek"?PROV_DEF.deepseek.model:"");
    if(!mdl)throw new Error(T("modelMissing"));
    const res=await fetch(aiBase()+"/chat/completions",{
      method:"POST",
      headers:{"content-type":"application/json","authorization":"Bearer "+key},
      body:JSON.stringify({model:mdl,max_tokens:maxTokens||800,
        messages:[{role:"system",content:AI_SYS()}].concat(messages)})
    });
    if(!res.ok){const t=await res.text();throw new Error(res.status+" "+t.slice(0,200))}
    const data=await res.json();
    const ch=(data.choices||[])[0];
    return (ch&&ch.message&&ch.message.content)||"";
  }catch(e){throw wrapNetErr(e)}
}
/* file -> base64 (downscaled) */
function fileToB64(file,maxW){return new Promise((ok,bad)=>{
  const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{const sc=Math.min(1,(maxW||1024)/img.width);
    const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);ok(c.toDataURL("image/jpeg",.85).split(",")[1])};
  img.onerror=bad;img.src=url;})}
/* v1.9.4: shared vision call (images + prompt -> text) for scan & form-check */
async function callAIVision(imgs,prompt,maxTokens){
  const key=S.settings.apiKey;if(!key)throw new Error(T("aiScanNeedKey"));
  try{
    if(aiProvider()==="anthropic"){
      const content=imgs.map(b=>({type:"image",source:{type:"base64",media_type:"image/jpeg",data:b}}));
      content.push({type:"text",text:prompt});
      const res=await fetch(aiBase()+"/v1/messages",{
        method:"POST",
        headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:S.settings.model||"claude-sonnet-4-5",max_tokens:maxTokens||400,messages:[{role:"user",content}]})
      });
      if(!res.ok){const t=await res.text();throw new Error(res.status+" "+t.slice(0,200))}
      const data=await res.json();
      return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
    }
    /* OpenAI-compatible vision format; providers without vision will return an error shown to the user */
    const mdl=S.settings.model||(aiProvider()==="deepseek"?PROV_DEF.deepseek.model:"");
    if(!mdl)throw new Error(T("modelMissing"));
    const content=imgs.map(b=>({type:"image_url",image_url:{url:"data:image/jpeg;base64,"+b}}));
    content.push({type:"text",text:prompt});
    const res=await fetch(aiBase()+"/chat/completions",{
      method:"POST",
      headers:{"content-type":"application/json","authorization":"Bearer "+S.settings.apiKey},
      body:JSON.stringify({model:mdl,max_tokens:maxTokens||400,messages:[{role:"user",content}]})
    });
    if(!res.ok){const t=await res.text();throw new Error(res.status+" "+t.slice(0,200))}
    const data=await res.json();
    const ch=(data.choices||[])[0];
    return (ch&&ch.message&&ch.message.content)||"";
  }catch(e){throw wrapNetErr(e)}
}
/* ===== v1.9.4: async video form self-check (Beta) ===== */
/* frames are extracted ON DEVICE; only ~6 stills go to the user's own API; nothing is uploaded or stored */
function extractVideoFrames(file,n,maxW){return new Promise((ok,bad)=>{
  const v=document.createElement("video");
  v.muted=true;v.playsInline=true;v.preload="auto";
  const url=URL.createObjectURL(file);
  const frames=[];let times=[];
  const c=document.createElement("canvas");
  const finish=()=>{URL.revokeObjectURL(url);ok(frames)};
  const seekNext=()=>{if(!times.length){finish();return}v.currentTime=times.shift()};
  v.onloadedmetadata=()=>{
    if(!v.videoWidth){bad(new Error("video"));return}
    const dur=Math.min(isFinite(v.duration)?v.duration:10,20);
    for(let i=0;i<(n||6);i++)times.push(Math.max(0.05,dur*(i+0.5)/(n||6)));
    seekNext();
  };
  v.onseeked=()=>{
    try{
      const sc=Math.min(1,(maxW||768)/v.videoWidth);
      c.width=Math.round(v.videoWidth*sc);c.height=Math.round(v.videoHeight*sc);
      c.getContext("2d").drawImage(v,0,0,c.width,c.height);
      frames.push(c.toDataURL("image/jpeg",.8).split(",")[1]);
    }catch(e){}
    seekNext();
  };
  v.onerror=()=>{URL.revokeObjectURL(url);bad(new Error("video"))};
  v.src=url;
})}
function parseFormCheck(txt){
  const m=String(txt).match(/\{[\s\S]*\}/);if(!m)throw new Error("parse");
  const r=JSON.parse(m[0]);
  const arr=x=>Array.isArray(x)?x.filter(Boolean):[];
  return {ok:arr(r.ok).map(String),
    issues:arr(r.issues).map(i=>typeof i==="string"?{point:i,fix:""}:{point:String(i.point||""),fix:String(i.fix||i.suggestion||"")}).filter(i=>i.point),
    unclear:arr(r.unclear).map(String)};
}

  const ex=EXMAP[exId];if(!ex)throw new Error("ex");
  const prompt=`The user recorded themselves performing "${ex.en}" (${ex.zh}) and these ${frames.length} frames were sampled evenly from one set, in chronological order.
Coaching cues for this exercise: ${ex.ce}
Common mistakes / cautions: ${ex.we}
Assess ONLY what is clearly visible in the frames. Respond in ${LANG==="zh"?"Simplified Chinese":"English"}. Output ONLY one JSON object on the last line:
{"ok":["specific things done well"],"issues":[{"point":"observed problem","fix":"one concrete correction"}],"unclear":["what cannot be judged from these frames"]}
Hard rules: never diagnose injuries or pain; if form looks risky, advise lowering the weight and consulting a coach (put it in issues); if the frames do not show this exercise or are too unclear, say so in "unclear" and keep the other arrays empty; max 3 items per array; do not invent details you cannot see.`;

}

async function aiScanEquipment(files){
  const key=S.settings.apiKey;if(!key)throw new Error(T("aiScanNeedKey"));
  const imgs=[];for(const f of files)imgs.push(await fileToB64(f,1568));
  const catList=EQUIP.map(e=>`${e.id}: ${e.en}${EQUIP_DESC[e.id]?" — "+EQUIP_DESC[e.id]:""}`).join("\n");
  const prompt="You are identifying commercial gym equipment in photos. Category list (id: name — visual features):\n"+catList
    +"\nCommon confusions to check: m_lat pulley is OVERHEAD (pull down) vs m_row pulls HORIZONTALLY; leg_ext roller sits in FRONT of the shins vs leg_curl roller BEHIND the ankles; smith bar rides on rails vs barbell in a rack is free; hack has shoulder pads vs leg_press has an overhead foot platform."
    +"\nFirst think briefly (1-2 sentences) about the distinguishing features you can actually see. Then on the LAST line output ONLY a JSON array of the identified categories, each as {\"id\":\"m_lat\",\"confidence\":0.9} with confidence 0-1, sorted most likely first. For an ambiguous machine include up to 3 alternative candidates. Use only ids from the list.";
  const txt=await callAIVision(imgs,prompt,400);
  /* accept both legacy ["hack"] and new [{"id","confidence"}] formats; take the LAST JSON array (after reasoning) */
  const ms=txt.match(/\[[\s\S]*?\]/g);if(!ms)throw new Error("parse");
  let arr=null;
  for(let i=ms.length-1;i>=0&&!arr;i--){try{const p=JSON.parse(ms[i]);if(Array.isArray(p))arr=p}catch(e){}}
  if(!arr)throw new Error("parse");
  const cands=[];
  arr.forEach(it=>{
    const id=typeof it==="string"?it:(it&&it.id);
    const conf=typeof it==="string"?0.9:Math.max(0,Math.min(1,+(it&&(it.confidence??it.conf))||0.5));
    if(EQMAP[id]&&!cands.some(c=>c.id===id))cands.push({id,conf});
  });
  if(!cands.length)throw new Error("none");
  cands.sort((a,b)=>b.conf-a.conf);
  return cands;
}

function weeklyStats(){
  const now=Date.now(),wk=7*86400000;
  const inWin=(l,a,b)=>{const t=new Date(l.date).getTime();return t>now-a&&t<=now-b};
  const this7=S.logs.filter(l=>inWin(l,wk,0));
  const prev7=S.logs.filter(l=>inWin(l,2*wk,wk));
  const s7=this7.filter(l=>l.dayKey!=="swim"),p7=prev7.filter(l=>l.dayKey!=="swim");
  const vol=ls=>Math.round(ls.reduce((a,l)=>a+totalVolume(l),0));
  const v7=vol(s7),vp=vol(p7);
  const muscleSets={};
  s7.forEach(l=>l.entries.forEach(e=>{const ex=EXMAP[e.exId];if(!ex)return;const n=e.sets.filter(s=>s.done).length;ex.m.forEach(m=>{muscleSets[m]=(muscleSets[m]||0)+n})}));
  /* per-exercise trend: best of each of the last 3 sessions (e1RM for weighted, reps/secs for pure bodyweight) */
  const exTrend=[];
  [...new Set(s7.flatMap(l=>l.entries.map(e=>e.exId)))].forEach(id=>{
    const hist=[];
    for(let i=S.logs.length-1;i>=0&&hist.length<3;i--){
      const en=S.logs[i].entries.find(e=>e.exId===id);
      if(en&&en.sets.length)hist.unshift(Math.round(Math.max(...en.sets.map(s=>(+s.w>0?est1RM(+s.w,+s.r):(+s.r||0))))));
    }
    if(hist.length>=2){
      const d=hist[hist.length-1]-hist[0];
      exTrend.push({exId:id,ex:exName(id),series:hist,trend:d>0.5?"up":(d<-0.5?"down":"flat")});
    }
  });
  const swim7=this7.filter(l=>l.dayKey==="swim");
  return {
    week:{sessions:s7.length,planned:S.plan?S.plan.days.filter(d=>!d.swimSegs).length:null,volumeKg:v7,swimSessions:swim7.length,swimMeters:swim7.reduce((a,l)=>a+(l.swimDist||0),0)},
    prevWeek:{sessions:p7.length,volumeKg:vp},
    volumeChangePct:vp>0?Math.round((v7-vp)/vp*100):null,
    setsPerMuscle:muscleSets,
    exerciseTrends:exTrend,
    newPRs:s7.flatMap(l=>(l.prs||[]).map(p=>({ex:exName(p.exId),w:p.w}))),
    readinessScores:s7.filter(l=>l.readiness).map(l=>l.readiness.score),
    postChecks:s7.filter(l=>l.post).map(l=>({feel:l.post.feel,aches:l.post.aches||[]})),
  };
}
function wkAuditHtml(st){
  const tr={up:T("trUp"),flat:T("trFlat"),down:T("trDown")};
  const feelTxt=[T("postEasy"),T("postRight"),T("postHard")];
  let rows=`<div class="row mt8"><span class="dim grow">${T("wkSessions")}</span><b class="sub">${st.week.sessions}${st.week.planned?` / ${st.week.planned}`:""}</b></div>
  <div class="row mt8"><span class="dim grow">${T("wkVolume")}</span><b class="sub">${st.week.volumeKg} kg${st.volumeChangePct!==null?` <span class="dim">(${T("wkVsPrev")} ${st.volumeChangePct>=0?"+":""}${st.volumeChangePct}%)</span>`:""}</b></div>`;
  const ms=Object.entries(st.setsPerMuscle);
  if(ms.length)rows+=`<div class="mt8"><span class="dim">${T("wkMuscleSets")}</span><div class="mt8">${ms.map(([m,n])=>`<span class="tag">${T("mus_"+m)} ${n}</span>`).join("")}</div></div>`;
  if(st.exerciseTrends.length)rows+=`<div class="mt8"><span class="dim">${T("wkTrends")}</span>${st.exerciseTrends.map(t=>`<div class="row mt8"><span class="sub grow">${esc(t.ex)}</span><span class="sub">${t.series.join(" → ")} <b>${tr[t.trend]}</b></span></div>`).join("")}</div>`;
  if(st.newPRs.length)rows+=`<div class="mt8"><span class="dim">${T("wkPRs")}</span><div class="mt8">${st.newPRs.map(p=>`<span class="tag acc">🏆 ${esc(p.ex)} ${p.w}kg</span>`).join("")}</div></div>`;
  if(st.readinessScores.length)rows+=`<div class="row mt8"><span class="dim grow">${T("wkReadiness")}</span><span class="sub">${st.readinessScores.join(", ")}</span></div>`;
  if(st.postChecks.length)rows+=`<div class="mt8"><span class="dim">${T("wkPost")}</span><div class="mt8">${st.postChecks.map(p=>`<span class="tag ${p.feel===2||p.aches.length?"":"acc"}">${p.feel!==null&&p.feel!==undefined?feelTxt[p.feel]:""}${p.aches.length?" 🩹"+p.aches.map(a=>T("inj_"+a)).join("/"):""}</span>`).join("")}</div></div>`;
  if(st.week.swimSessions)rows+=`<div class="row mt8"><span class="dim grow">${T("wkSwimL")}</span><span class="sub">${st.week.swimSessions} × · ${st.week.swimMeters}m</span></div>`;
  return `<details class="card mt8" id="wkAudit"><summary style="cursor:pointer;font-weight:700;font-size:13px">${T("wkAudit")}</summary>${rows}</details>`;
}
async function aiWeeklyReview(){
  if(!S.settings.apiKey){toast(T("aiScanNeedKey"));return}
  aiSheetShell(T("aiWeekly").replace("🤖 ",""));
  const st=weeklyStats();
  if(!st.week.sessions&&!st.week.swimSessions){$("#aiOut").innerHTML=`<p class="sub">${T("wkNoData")}</p>`;return}
  try{
    const q=LANG==="zh"
      ?"请基于 WEEKLY_STATS 做一次周复盘：1) 训练频率与计划的差距；2) 哪些动作在进步、哪些停滞（引用 exerciseTrends）；3) 结合 postChecks/readinessScores 评估恢复情况；4) 下周的1-2条方向性建议（不要给具体重量数字）。所有数字只能来自 WEEKLY_STATS，禁止自行计算或编造数字；WEEKLY_STATS 里没有的数据就明说没有。"
      :"Weekly review based on WEEKLY_STATS: 1) adherence vs plan; 2) which lifts progressed vs stalled (cite exerciseTrends); 3) recovery read from postChecks/readinessScores; 4) 1-2 directional suggestions for next week (no specific weight prescriptions). Every number MUST come from WEEKLY_STATS — never compute or invent figures; if something isn't in WEEKLY_STATS, say so.";
    const out=await callAI([{role:"user",content:"USER DATA:\n"+userContext()+"\n\nWEEKLY_STATS (pre-computed by the app's rules engine — the ONLY valid source of numbers):\n"+JSON.stringify(st)+"\n\nQUESTION: "+q}]);
    $("#aiOut").innerHTML=`<div class="msg a">${esc(out)}</div>`+wkAuditHtml(st);
  }catch(e){$("#aiOut").innerHTML=`<span style="color:var(--red)">${T("aiErr")}${esc(e.message)}</span>`}
}
let chatHist=[];
function openChat(){
  if(!S.settings.apiKey){toast(T("aiScanNeedKey"));return}
  openSheet(`<h3>${T("aiChat")}</h3><div id="chatBox" style="min-height:120px;max-height:42vh;overflow-y:auto">${chatHist.map(m=>`<div class="msg ${m.role==="user"?"u":"a"}">${esc(m.content)}</div>`).join("")}</div>
  <div class="row mt12"><input id="chatIn" class="grow" placeholder="${T("aiChatPh")}"><button class="btn sm" id="chatSend">${T("send")}</button></div>
  <button class="btn ghost mt8" id="chatApply">${T("applyBtn")}</button>`);
  $("#chatApply").onclick=aiApplyPlanFlow;
  const send=async()=>{
    const v=$("#chatIn").value.trim();if(!v)return;
    $("#chatIn").value="";
    chatHist.push({role:"user",content:v});
    const box=$("#chatBox");
    box.innerHTML+=`<div class="msg u">${esc(v)}</div><div class="msg a" id="pending"><span class="spin"></span></div>`;box.scrollTop=box.scrollHeight;
    try{
      const msgs=[{role:"user",content:"USER DATA:\n"+userContext()}, {role:"assistant",content:"OK, I have the user's context."}].concat(chatHist.slice(-10));
      const out=await callAI(msgs);
      chatHist.push({role:"assistant",content:out});
      const p=document.getElementById("pending");if(p){p.id="";p.textContent=out}
      box.scrollTop=box.scrollHeight;
    }catch(e){const p=document.getElementById("pending");if(p){p.id="";p.innerHTML=`<span style="color:var(--red)">${T("aiErr")}${esc(e.message)}</span>`}}
  };
  $("#chatSend").onclick=send;
  $("#chatIn").onkeydown=e=>{if(e.key==="Enter")send()};
}

/* ===== apply chat consensus to the plan (validated, user-confirmed) ===== */
async function aiApplyPlanFlow(){
  if(!S.settings.apiKey){toast(T("aiScanNeedKey"));return}
  openSheet(`<h3>${T("applyTitle")}</h3><div id="aiOut"><span class="spin"></span> ${T("aiThinking")}</div>`);
  try{
    const eqList=availEquip();const inj=userInjuries();
    const avail=EXDB.filter(e=>exAvailable(e,eqList)&&riskLevel(e.id,inj)<2);
    const list=avail.map(e=>e.id+" = "+e.zh+" / "+e.en).join("\n");
    const curStrength=S.plan?S.plan.days.filter(d=>!d.swimSegs).length:3;
    const instr="【计划修改指令】[PLAN REVISION COMMAND] Based on the USER DATA and our conversation, output the FULL revised strength plan as ONLY one JSON object, no other text. Format: {\"days\":[{\"key\":\"push|pull|legs|upper|lower|fullA|fullB\",\"name\":\""+(LANG==="zh"?"短标题(中文,可选)":"short title in English (optional)")+"\",\"exercises\":[{\"exId\":\"...\",\"sets\":4,\"reps\":\"8-12\",\"rest\":90}]}]}. Hard rules: exId MUST come from this whitelist only:\n"+list+"\nOutput exactly "+curStrength+" strength day(s); do NOT include swim days (the app keeps them automatically). sets 1-6 integer, reps like \"8-12\", rest in seconds 30-240.";
    const msgs=[{role:"user",content:"USER DATA:\n"+userContext()},{role:"assistant",content:"OK, I have the user's context."}]
      .concat(chatHist.slice(-10)).concat([{role:"user",content:instr}]);
    const out=await callAI(msgs,2000);
    const m=out.match(/\{[\s\S]*\}/);if(!m)throw new Error(T("applyFail"));
    let obj;try{obj=JSON.parse(m[0])}catch(e){throw new Error(T("applyFail"))}
    const gp=GOALPARAM[(S.profile&&S.profile.goal)||"muscle"];
    let dropped=0;const KEYS=["push","pull","legs","upper","lower","fullA","fullB"];
    const days=(obj.days||[]).map(d=>{
      const exs=(d.exercises||[]).map(e=>{
        const ex=EXMAP[e&&e.exId];
        if(!ex||!exAvailable(ex,eqList)||riskLevel(e.exId,inj)>=2){dropped++;return null}
        let sets=Math.round(+e.sets)||(ex.c?gp.cSets:gp.iSets);sets=Math.min(8,Math.max(1,sets));
        let reps=String(e.reps||"").trim();if(!/^\d{1,2}(-\d{1,2})?$/.test(reps))reps=ex.c?gp.cReps:gp.iReps;
        let rest=Math.round(+e.rest)||(ex.c?gp.rest:gp.restIso);rest=Math.min(300,Math.max(30,rest));
        const en={exId:e.exId,sets,reps,rest};
        if(riskLevel(e.exId,inj)===1)en.cau=1;
        return en;
      }).filter(Boolean);
      if(!exs.length)return null;
      return {key:KEYS.includes(d.key)?d.key:"fullA",label:String(d.name||"").slice(0,14),exercises:sortDayExercises(exs)};
    }).filter(Boolean);
    if(!days.length)throw new Error(T("applyFail"));
    /* preview */
    let h=`<h3>${T("applyTitle")}</h3>`;
    if(dropped)h+=`<div class="warnbox" style="margin-bottom:10px">${fmt(T("applyDropped"),{n:dropped})}</div>`;
    days.forEach((d,di)=>{
      h+=`<div class="card daycard"><b>${T("day").replace("{n}",di+1)} · ${d.label?esc(d.label):TD(d.key)}</b>`;
      d.exercises.forEach((e,ei)=>{
        h+=`<div class="exrow"><div class="exnum">${ei+1}</div><div class="grow"><div class="exname">${exName(e.exId)}${e.cau?` <span class="tag orange">${T("cautionTag")}</span>`:""}</div><div class="exmeta">${e.sets} ${T("sets")} × ${e.reps} · ${T("rest")} ${e.rest}s</div></div></div>`;
      });
      h+=`</div>`;
    });
    h+=`<button class="btn" id="applyGo">${T("applyConfirmBtn")}</button><button class="btn sec mt8" onclick="closeSheet()">${T("cancel")}</button>`;
    $("#sheetBody").innerHTML=h;
    $("#applyGo").onclick=()=>{
      const swims=S.plan?S.plan.days.filter(d=>d.swimSegs):[];
      const newDays=days.slice();
      if(swims[0])newDays.splice(Math.min(2,newDays.length),0,swims[0]);
      if(swims[1])newDays.push(swims[1]);
      if(!S.plan)S.plan={freq:newDays.length,goal:(S.profile||{}).goal||"muscle",createdAt:new Date().toISOString()};
      S.plan.days=newDays;S.plan.splitName="splitCustom";
      save();closeSheet();switchView("plan");toast(T("applyOk"));
    };
  }catch(e){
    const out=document.getElementById("aiOut");
    if(out)out.innerHTML=`<span style="color:var(--red)">${esc(e.message||e)}</span>`;
    else toast(String(e.message||e));
  }
}
